<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HogarCash — Automatizador de Carruseles</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="icon">✨</span>
                <h1>Carousel<span>Auto</span></h1>
            </div>
            <p class="subtitle">Pega tu HTML y genera imágenes premium en segundos.</p>
        </header>

        <main>
            <div class="card editor-card">
                <div class="card-header">
                    <h3>Código HTML</h3>
                    <span class="badge">Input</span>
                </div>
                <textarea id="htmlInput" placeholder="Pega aquí el código HTML de tu carrusel..."></textarea>
                <div class="actions">
                    <button id="generateBtn" class="btn-primary">
                        <span class="btn-text">Generar Carrusel</span>
                        <div class="loader"></div>
                    </button>
                </div>
            </div>

            <div id="resultCard" class="card result-card hidden">
                <div class="card-header">
                    <h3>¡Listo!</h3>
                    <span class="badge success">Completado</span>
                </div>
                <div class="result-content">
                    <div class="success-icon">✅</div>
                    <p id="resultMsg">Se han generado todas las diapositivas con éxito.</p>
                    <div class="download-box">
                        <a id="downloadLink" href="#" class="btn-secondary" download>
                            Descargar Todo (ZIP)
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 HogarCash Toolset — Diseñado para la perfección.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
